<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Icon Container -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Inner White Disc -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Ashoka Chakra Spokes Motif in Center -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#000080" stroke-width="8"/>
  <circle cx="256" cy="256" r="28" fill="#000080"/>
  
  <!-- 24 Spokes -->
  <g stroke="#000080" stroke-width="4.5" stroke-linecap="round">
    <line x1="256" y1="116" x2="256" y2="396"/>
    <line x1="116" y1="256" x2="396" y2="256"/>
    <line x1="157" y1="157" x2="355" y2="355"/>
    <line x1="157" y1="355" x2="355" y2="157"/>
    <line x1="202.5" y1="126.5" x2="309.5" y2="385.5"/>
    <line x1="126.5" y1="202.5" x2="385.5" y2="309.5"/>
    <line x1="126.5" y1="309.5" x2="385.5" y2="202.5"/>
    <line x1="202.5" y1="385.5" x2="309.5" y2="126.5"/>
    <line x1="178.6" y1="137.4" x2="333.4" y2="374.6"/>
    <line x1="137.4" y1="178.6" x2="374.6" y2="333.4"/>
    <line x1="137.4" y1="333.4" x2="374.6" y2="178.6"/>
    <line x1="178.6" y1="374.6" x2="333.4" y2="137.4"/>
  </g>

  <!-- Golden AI Sparkle in Top Right -->
  <path d="M370 120 L380 90 L390 120 L420 130 L390 140 L380 170 L370 140 L340 130 Z" fill="#F59E0B" filter="url(#shadow)"/>
  
  <!-- Bottom Text Banner: નાગરિક સેવા -->
  <rect x="106" y="375" width="300" height="70" rx="35" fill="#1E293B" filter="url(#shadow)"/>
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">નાગરિકસેવા AI</text>
</svg>
